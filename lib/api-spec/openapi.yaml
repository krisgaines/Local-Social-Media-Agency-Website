openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Website inquiry submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit an agency inquiry
      description: Validates and delivers an inquiry to the connected CRM, tracking sheet, and email service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "200":
          description: Inquiry accepted. The response identifies each delivery outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSubmissionResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LeadInput:
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        companyWebsite:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 2
          maxLength: 120
        services:
          type: array
          minItems: 1
          items:
            type: string
            enum: [content, management, strategy, ads, photography]
        monthlyBudget:
          type: string
          enum: [under-1000, 1000-2500, 2500-5000, over-5000, not-sure]
        primaryGoal:
          type: string
          maxLength: 500
        platforms:
          type: array
          items:
            type: string
            enum: [instagram, facebook, tiktok, linkedin, pinterest]
        message:
          type: string
          maxLength: 3000
        company:
          type: string
          maxLength: 160
          description: Anti-spam honeypot; leave blank.
      required:
        - submissionId
        - fullName
        - businessName
        - email
        - city
        - services
        - monthlyBudget
        - primaryGoal
        - platforms
    LeadDeliveryStatus:
      type: string
      enum: [sent, failed]
    LeadSubmissionResult:
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [complete, partial]
        deliveries:
          type: object
          properties:
            hubspot:
              $ref: "#/components/schemas/LeadDeliveryStatus"
            googleSheets:
              $ref: "#/components/schemas/LeadDeliveryStatus"
            gmail:
              $ref: "#/components/schemas/LeadDeliveryStatus"
          required: [hubspot, googleSheets, gmail]
        message:
          type: string
      required: [submissionId, status, deliveries, message]

